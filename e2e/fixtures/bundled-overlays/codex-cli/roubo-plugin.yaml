id: codex-cli
name: Codex CLI
version: 0.1.0
description: E2E overlay that installs a second agent plugin during Playwright runs, so AP-TC-113 S002 can read a real Codex CLI compatibility line (floor, tested ceiling, detected version) rather than a fixtured one. Not for production.
kind: agent
roubo: ^1.0.0
entry: ./index.mjs
contractVersion: 1
# OPT-IN, not ambient. Every POST /test/__reset forces this id disabled, via
# OPT_IN_AGENT_FIXTURE_PLUGIN_IDS in server/routes/test.ts (#681). Consent has no
# revoke route and outlives both the reset and the server process, so the enable
# ledger is the only lever that stops a spec which consented this agent from
# leaving a SECOND available agent behind: "exactly one available agent" is a
# resolution fallback several specs depend on (AP-TC-087, NFR-018). A spec that
# wants this overlay enables it (POST /api/plugins/codex-cli/enable) and hands it
# back disabled.
#
# The window below is re-based on the shipped Codex agent plugin's manifest
# (roubo-plugins/plugins/codex/roubo-plugin.yaml, #520), so the overlay claims
# the same compatibility window the real plugin does rather than the plausible
# bracket it carried before that plugin existed. Both come from spike 502's
# real-binary survey
# (.specifications/agent-plugins/spikes/spike-502-agent-contract-shape.md),
# which probed @openai/codex 0.144.1 directly: `codex --version` prints
# `codex-cli 0.144.1`, the only version any Roubo work has validated. Re-base
# this block again whenever the shipped manifest's window moves, and keep the
# stub's version (e2e/fixtures/bin/roubo-e2e-codex-stub) inside it so the card
# resolves `within-tested-range`.
#
# UNLIKE the sibling claude-code overlay, the RUNTIME still mirrors nothing: the
# argv mapping, config schema, notification wiring and permissions bindings stay
# out of index.mjs on purpose (see the note there).
#
# The probe names the e2e stub rather than `codex`, for the same reason the
# Claude stub is not named `claude`: `resolveShellPath()` prepends
# `~/.local/bin`, so a real Codex install on a developer machine would win the
# PATH lookup and the card would report that binary's version instead.
agentCompatibility:
  minVersion: 0.144.0
  testedCeiling: 0.144.1
  probe:
    command: roubo-e2e-codex-stub
    args:
      - --version
    parse: semver
# No `configSchema`, deliberately. AP-TC-113 S002 observes the compatibility
# line only, and the AP-TC-087 guard counts `config-field-<key>` test ids
# PAGE-WIDE while every agent card mounts its form expanded, so a `model` or
# `effort` property here would make that guard read two controls where it
# expects one and fail on a fixture artefact. The shipped plugin's real schema
# (model, reasoning effort, approval policy, sandbox, extra arguments) lives in
# roubo-plugins/plugins/codex/roubo-plugin.yaml and is deliberately not copied
# here; exercising it through this overlay needs that guard scoped first.
permissions:
  network:
    hosts: []
  credentials:
    slots: []
  filesystem:
    paths: []
  # An agent plugin must declare `processes: false`; the descriptor is its only
  # write route (PluginManifestSchema enforces this for kind: agent).
  processes: false
  ports: false
  docker: false
