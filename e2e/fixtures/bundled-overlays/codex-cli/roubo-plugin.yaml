id: codex-cli
name: Codex CLI
version: 0.2.0
description: E2E overlay that takes the bundled codex agent plugin's slot during Playwright runs. Mirrors the real plugin's configSchema and argv mapping against a stub CLI so AP-TC-056 and AP-TC-105 can drive the integrated configure-then-launch journey, and so AP-TC-113 S002 can read a real compatibility line. Not for production.
kind: agent
roubo: ^1.0.0
entry: ./index.mjs
contractVersion: 1
# OPT-IN, not ambient. Every POST /test/__reset forces this id disabled, via
# OPT_IN_AGENT_FIXTURE_PLUGIN_IDS in server/routes/test.ts (#681). Consent has no
# revoke route and outlives both the reset and the server process, so the enable
# ledger is the only lever that stops a spec which consented this agent from
# leaving a SECOND available agent behind: "exactly one available agent" is a
# resolution fallback several specs depend on (AP-TC-087, NFR-018). A spec that
# wants this overlay enables it (POST /api/plugins/codex-cli/enable) and hands it
# back disabled.
#
# The window below is re-based on the shipped Codex agent plugin's manifest
# (roubo-plugins/plugins/codex/roubo-plugin.yaml, #520), so the overlay claims
# the same compatibility window the real plugin does rather than the plausible
# bracket it carried before that plugin existed. Both come from spike 502's
# real-binary survey
# (.specifications/agent-plugins/spikes/spike-502-agent-contract-shape.md),
# which probed @openai/codex 0.144.1 directly: `codex --version` prints
# `codex-cli 0.144.1`, the only version any Roubo work has validated. Re-base
# this block again whenever the shipped manifest's window moves, and keep the
# stub's version (e2e/fixtures/bin/roubo-e2e-codex-stub) inside it so the card
# resolves `within-tested-range`.
#
# The RUNTIME now mirrors the shipped plugin's argv mapping and its waiting
# detection (#532), so the AP-TC-056 / AP-TC-105 journeys can drive the
# integrated configure-then-launch path. The notification wiring and the
# permissions bindings still stay out of index.mjs (see the note there).
#
# The probe names the e2e stub rather than `codex`, for the same reason the
# Claude stub is not named `claude`: `importLoginShellEnv()` prepends
# `~/.local/bin`, so a real Codex install on a developer machine would win the
# PATH lookup and the card would report that binary's version instead.
agentCompatibility:
  minVersion: 0.144.0
  testedCeiling: 0.144.1
  probe:
    command: roubo-e2e-codex-stub
    args:
      - --version
    parse: semver
# Copied VERBATIM from roubo-plugins/plugins/codex/roubo-plugin.yaml so the AI
# Agents card renders the real Model / Reasoning effort / Approval policy /
# Sandbox selects plus the real Additional CLI arguments field. Any divergence
# here would make the AP-TC-105 drift guard assert a form the shipped plugin does
# not have.
#
# This schema was held back until #532 for one reason: the AP-TC-087 guard read
# `config-field-<key>` test ids PAGE-WIDE while every agent card mounts its form
# expanded, so a second `model` property made that guard count two controls where
# it expects one. Those reads are now scoped to
# `agent-plugin-card-claude-code`, so a schema here is safe. Keep them scoped.
configSchema:
  type: object
  properties:
    model:
      title: Model
      type: string
      default: gpt-5.2-codex
      description: The model the session runs on, passed as `--model`. `Account default` sends no `--model` flag and defers to the Codex configuration.
      oneOf:
        - const: default
          title: Account default
        - const: gpt-5.2-codex
          title: GPT-5.2 Codex
        - const: gpt-5.1-codex
          title: GPT-5.1 Codex
        - const: gpt-5.1-codex-mini
          title: GPT-5.1 Codex mini
    effort:
      title: Reasoning effort
      type: string
      default: medium
      description: Reasoning effort passed as `-c model_reasoning_effort=`.
      oneOf:
        - const: minimal
          title: Minimal
        - const: low
          title: Low
        - const: medium
          title: Medium
        - const: high
          title: High
        - const: xhigh
          title: Extra high
    approvalPolicy:
      title: Approval policy
      type: string
      default: on-request
      description: When Codex asks before acting, passed as `-c approval_policy=`. A permission posture chosen on the project's permissions screen overrides this field, sending the posture's own value instead, so exactly one `approval_policy` override ever reaches the CLI.
      oneOf:
        - const: untrusted
          title: Untrusted
        - const: on-request
          title: On request
        - const: never
          title: Never
    sandbox:
      title: Sandbox
      type: string
      default: workspace-write
      description: What the session may write, passed as `-c sandbox_mode=`. A permission posture chosen on the project's permissions screen overrides this field, sending the posture's own value instead, so exactly one `sandbox_mode` override ever reaches the CLI.
      oneOf:
        - const: read-only
          title: Read only
        - const: workspace-write
          title: Workspace write
        - const: danger-full-access
          title: Full access
    extraArgs:
      title: Additional CLI arguments
      type: string
      description: Free-form extra arguments appended after the generated flags. Split into discrete argv tokens with quoting honoured; shell metacharacters are never interpreted.
permissions:
  network:
    hosts: []
  credentials:
    slots: []
  filesystem:
    paths: []
  # An agent plugin must declare `processes: false`; the descriptor is its only
  # write route (PluginManifestSchema enforces this for kind: agent).
  processes: false
  ports: false
  docker: false
