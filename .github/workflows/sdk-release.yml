name: sdk-release

concurrency:
  group: sdk-release-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - 'sdk-v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'SDK tag to publish (must already exist, format sdk-vX.Y.Z)'
        required: true

jobs:
  publish:
    name: publish @roubo/plugin-sdk + shared
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: 'https://registry.npmjs.org'

      - name: Verify tag matches package versions
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != sdk-v* ]]; then
            echo "::error::Tag '${RELEASE_TAG}' must start with 'sdk-v' (e.g. sdk-v0.1.0)"
            exit 1
          fi
          expected="${RELEASE_TAG#sdk-v}"
          # The two packages version in lockstep: every one must match the tag.
          for pkg in plugin-sdk shared; do
            actual="$(jq -r '.version' "${pkg}/package.json")"
            if [[ "${expected}" != "${actual}" ]]; then
              echo "::error::Tag version '${expected}' does not match ${pkg}/package.json version '${actual}'"
              exit 1
            fi
            echo "Tag and ${pkg}/package.json version match: ${actual}"
          done

      - run: npm ci

      - name: Ensure npm CLI supports trusted publishing
        run: npm install -g npm@latest

      # Build plugin-sdk before publishing. @roubo/shared publishes its raw .ts
      # sources, so it has no build step.
      - run: npm run build -w plugin-sdk

      - run: npx vitest run plugin-sdk/

      # Publish in dependency order so each package's pinned dependencies are
      # already on the registry when the next one resolves.
      - name: Publish @roubo/plugin-sdk (trusted publisher / OIDC)
        working-directory: plugin-sdk
        run: npm publish --provenance

      - name: Publish @roubo/shared (trusted publisher / OIDC)
        working-directory: shared
        run: npm publish --provenance

  # Automated compatibility gate: prove every published plugin builds and tests
  # in a standalone (out-of-monorepo) checkout that resolves @roubo/plugin-sdk and
  # @roubo/shared from the LIVE npm registry at their just-published versions,
  # with no surviving file:/workspace ref.
  #
  # Started life as the single-plugin AC2 gate for #766, replacing a manual
  # maintainer check. #507 generalized it into a matrix (AP-NFR-004, AP-TC-123):
  # one leg per published plugin, each built and tested unchanged against the new
  # SDK. `fail-fast: false` runs every leg so the run names ALL the plugins a
  # breaking SDK change broke, not just the first (AP-TC-124 S002-O02).
  #
  # AP-TC-123 names five plugins (github-com, ghe, jira-self-hosted, process,
  # database). Only three exist in this repo today; `ghe` and `jira-self-hosted`
  # appear as plugin ids in e2e fixtures but have no source anywhere. Add them to
  # the matrix when their source lands.
  smoke:
    name: smoke (${{ matrix.plugin }})
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        plugin:
          - database
          - process
          - github-com
    steps:
      # Check out only to source the plugin's build inputs (src + tsup.config.ts);
      # the build itself runs in a fresh dir outside this tree.
      - uses: actions/checkout@v7.0.0
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      - uses: actions/setup-node@v6.4.0
        with:
          node-version-file: .nvmrc
          registry-url: 'https://registry.npmjs.org'

      - name: Build and test ${{ matrix.plugin }} standalone against the published packages
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag_name || github.ref_name }}
          PLUGIN: ${{ matrix.plugin }}
        run: |
          set -euo pipefail
          if [[ "${RELEASE_TAG}" != sdk-v* ]]; then
            echo "::error::Tag '${RELEASE_TAG}' must start with 'sdk-v' (e.g. sdk-v0.1.0)"
            exit 1
          fi
          # Lockstep tag version, identical to the publish job's version-match step.
          scripts/sdk-smoke.sh "${PLUGIN}" "${RELEASE_TAG#sdk-v}"
